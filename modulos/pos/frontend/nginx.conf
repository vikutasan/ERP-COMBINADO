# nginx.conf — Configuración SPA para el POS nuevo — FP-02.
#
# Sirve el bundle estático de Vite. Todas las rutas desconocidas redirigen
# a index.html para que React Router maneje la navegación del lado del cliente.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre: caché larga (1 año).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ruta principal: SPA fallback → index.html.
    # React Router se encarga del enrutamiento en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check para Docker (usado por docker-compose healthcheck).
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
