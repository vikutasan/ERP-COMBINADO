# Configuración de Alembic — FASE 1 (Cimiento de datos).
#
# La URL de conexión NO se escribe aquí: se lee de la variable de entorno
# DATABASE_URL en `migrations/env.py`. Así el mismo archivo sirve para
# desarrollo, pruebas y producción sin filtrar credenciales al repositorio.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Formato de los nombres de archivo de migración.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
